name: Free Kick — Nudge Scheduler

on:
  schedule:
    - cron: "0 9 * * 1,3,5"    # 9am UTC Mon/Wed/Fri — scheduled nudges
    - cron: "0 19 * * *"        # 7pm UTC daily — catch match results
    - cron: "*/15 14-22 * * *"  # Every 15 mins 2-10pm UTC — pre-match checks
  workflow_dispatch:             # Manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  nudge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run nudge script
        env:
          TWILIO_ACCOUNT_SID:  ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:   ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER:  ${{ secrets.TWILIO_FROM_NUMBER }}
          USER_PHONE_NUMBERS:  ${{ secrets.USER_PHONE_NUMBERS }}
          FOOTBALL_API_KEY:    ${{ secrets.FOOTBALL_API_KEY }}
        run: python src/nudge.py
