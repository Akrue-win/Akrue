name: Akrue — Match Bet Scheduler

on:
  schedule:
    # Disabled — now running via Railway cron
    # - cron: "*/15 * * * *"
    # - cron: "0 * * * *"
  workflow_dispatch:  # Keep this for manual --test runs
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Akrue bet script
        env:
          TWILIO_ACCOUNT_SID:  ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:   ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER:  ${{ secrets.TWILIO_FROM_NUMBER }}
          FOOTBALL_API_KEY:    ${{ secrets.FOOTBALL_API_KEY }}
          SHEET_ID:            ${{ secrets.SHEET_ID }}
          GOOGLE_CREDS_JSON:   ${{ secrets.GOOGLE_CREDS_JSON }}
        run: python src/nudge.py
